# Release automation. See RELEASING.md.
#
# The npm trusted publisher for `systemjs` is bound to this file name and the
# `npm-publish` environment. Renaming either breaks publishing.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. 6.15.2
        required: true
        type: string
      dry_run:
        description: Run npm publish --dry-run
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # A separate token so that CI runs on the Release PR; GITHUB_TOKEN
          # events don't trigger workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      !cancelled() && needs.release-please.result != 'failure' &&
      (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || vars.NPM_PUBLISH_DRY_RUN == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - run: npm install -g npm@11
      - name: Setup Chomp
        uses: guybedford/chomp-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: chomp build
      - run: chomp test:internal
      - run: chomp test:node
      - run: node .github/scripts/verify-release.mjs "$TAG"
      - name: npm publish
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --tag latest --dry-run
          else
            npm publish --tag latest
          fi
