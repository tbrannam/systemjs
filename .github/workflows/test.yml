name: CI

on:
  push:
    branches: [main, 7.x]
  pull_request:
    branches: [main, 7.x]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        chrome: [
          'latest'
        ]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Chomp
        uses: guybedford/chomp-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Setup Chrome ${{ matrix.chrome }}
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ matrix.chrome }}
      - name: npm ci
        run: npm ci
      - name: Chomp Test
        run: chomp test
        env:
          CI_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI_BROWSER_FLAGS: --headless=new --no-sandbox --no-first-run --no-default-browser-check --user-data-dir=${{ runner.temp }}\chrome-profile

  # The Node.js in .nvmrc is only the build toolchain. Consumers run
  # dist/system-node.cjs on their own Node.js, so test the built file there.
  node-compat:
    name: node-compat (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [10, 12, 14, 16, 18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Setup Chomp
        uses: guybedford/chomp-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: chomp dist/system-node.cjs
      # From here on only the consumer runtime is used; npm is not run, since
      # devEngines pins npm to the build toolchain.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node test/system-node-smoke.cjs
      - name: test:node
        if: matrix.node >= 12
        run: node node_modules/mocha/bin/mocha --timeout 5000 -b test/system-node.mjs
