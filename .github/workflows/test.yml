name: CI

on:
  push:
    branches: [main, 7.x]
  pull_request:
    branches: [main, 7.x]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        chrome: [
          'latest'
        ]
    steps:
      - uses: actions/checkout@v7
      - name: Setup Chomp
        uses: guybedford/chomp-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Setup Chrome ${{ matrix.chrome }}
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ matrix.chrome }}
      - name: npm ci
        run: npm ci
      - name: Chomp Test
        run: chomp test
        env:
          CI_BROWSER: ${{ steps.setup-chrome.outputs.chrome-path }}
          CI_BROWSER_FLAGS: --headless=new --no-sandbox --no-first-run --no-default-browser-check --user-data-dir=${{ runner.temp }}\chrome-profile
